before_action {
  fetch_mpm {
    mpm {
      pkg_name: "java/jdk"
      version: "jversion=jdk21.0.6+-google-release-735756698"
      directory: "jdk"
    }
    mpm {
      pkg_name: "devtools/copybara/tool_kokoro"
      version: "live"
      directory: "copybara"
    }
