# proto-file: google3/devtools/kokoro/config/proto/build.proto

build_file: "google3/third_party/py/google_cloud_mldiagnostics/kokoro/release_test_build.sh"

container_properties {
  docker_image: "us-central1-docker.pkg.dev/kokoro-container-bakery/kokoro/ubuntu/ubuntu2204/full:next"
}

before_action {
  invoke_blaze {
    name: "blaze_test"
    command: TEST
    targets: "//third_party/py/google_cloud_mldiagnostics/..."
  }
}

before_action {
  fetch_mpm {
    mpm {
      pkg_name: "java/jdk"
      version: "live"
      directory: "jdk"
    }
    mpm {
      pkg_name: "devtools/copybara/tool_kokoro"
      version: "live"
      directory: "copybara"
    }
  }
}

fileset_artifacts {
  name: "google-cloud-mldiagnostics"
  artifact_globs: "**/*.whl"
  artifact_globs: "**/*.tar.gz"
  error_if_missing: true
  destinations {
    store_attestation: true
    gcs {
      gcs_root_path: "oss-exit-gate-prod-projects-bucket/google-cloud-mldiagnostics/pypi/attestations"
    }
  }
  generate_sbom_from_fileset: true
  generate_attestation: true
}
